/* Layout concept: a night-time nautical chart. The map is a sea chart with a rope route
   between islands; lessons open as a captain's desk: orders on the left, the brass
   Interpreter (editor + console) on the right. Single deliberate dark theme. */
:root {
  --bg: #0a1a21;
  --sea: #0e2630;
  --panel: #12303b;
  --panel-2: #173a47;
  --line: #2a4d5a;
  --ink: #ece2c9;
  --ink-2: #c0c9bf;
  --muted: #84a0a1;
  --brass: #e2a948;
  --brass-hi: #f5cb7a;
  --rope: #8f6e47;
  --kelp: #63c28f;
  --coral: #ef6b54;
  --sand: #d9c08b;
  --sand-2: #b99c64;
  --leaf: #4e8a5b;
  --code-bg: #0b1d25;
  --f-display: "Pirata One", "Georgia", serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background-image:
    linear-gradient(rgba(132,160,161,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(132,160,161,.045) 1px, transparent 1px);
  background-size: 64px 64px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 2px; border-radius: 6px; }
code, pre, .mono { font-family: var(--f-mono); font-size: .86em; }
a { color: var(--brass-hi); }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding-block: 10px; margin: 0 auto; max-width: 1360px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; }
.brand-mark { width: 34px; height: 34px; }
.brand-name { font-family: var(--f-display); font-size: 30px; line-height: 1; color: var(--brass-hi); letter-spacing: .5px; }
.nav { display: flex; gap: 4px; }
.nav button {
  background: none; border: 1px solid transparent; border-radius: 999px;
  padding: 5px 14px; color: var(--ink-2); font-weight: 500;
}
.nav button:hover { color: var(--ink); border-color: var(--line); }
.nav button[aria-current="page"] { color: var(--bg); background: var(--brass); }
.stats { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.stat { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat svg { width: 20px; height: 20px; flex: none; }
.rank { display: flex; flex-direction: column; gap: 3px; min-width: 128px; }
.rank-name { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--brass-hi); font-weight: 700; line-height: 1; }
.rank-bar { height: 5px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.rank-bar i { display: block; height: 100%; background: var(--brass); border-radius: 3px; transition: width .6s; }
.iconbtn { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; color: var(--ink-2); font-weight: 700; font-size: 14px; letter-spacing: .05em; }
.iconbtn:hover { color: var(--ink); border-color: var(--muted); }
.iconbtn svg { width: 18px; height: 18px; display: block; }

main { max-width: 1360px; margin: 0 auto; padding-block: 20px 40px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 8px; justify-content: center;
  border-radius: 8px; padding: 9px 18px; font-weight: 700; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink);
}
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--brass); border-color: var(--brass); color: #1b1408; }
.btn.primary:hover:not(:disabled) { background: var(--brass-hi); }
.btn.go { background: var(--kelp); border-color: var(--kelp); color: #08200f; }
.btn.ghost { background: none; }
.btn.small { padding: 5px 12px; font-size: 15px; }
.btn svg { width: 16px; height: 16px; }
kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; color: var(--muted); }

/* ---------- map ---------- */
.map-layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 28px; align-items: start; }
.map-col { min-width: 0; }
.map-svg { width: 100%; max-width: 700px; display: block; margin: 0 auto; }
.map3d { position: relative; height: min(74vh, 760px); min-height: 440px; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: #0e2630; box-shadow: 0 18px 40px rgba(0,0,0,.35); }
.sea3d { position: absolute; inset: 0; }
.sea3d canvas { touch-action: none; cursor: grab; }
.sea3d canvas:active { cursor: grabbing; }
.map3d-hint { position: absolute; left: 12px; bottom: 10px; z-index: 3; font-size: 13px; color: #ece2c9; background: rgba(10,26,33,.6); padding: 4px 10px; border-radius: 999px; pointer-events: none; backdrop-filter: blur(4px); }
.sea3d-labels { position: absolute; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
.s3l { position: absolute; left: 0; top: 0; pointer-events: auto; display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border-radius: 999px; border: 1px solid rgba(226,169,72,.45);
  background: rgba(10,26,33,.78); color: #ece2c9; font: 600 14px/1.15 var(--f-body); text-align: left; cursor: pointer; white-space: nowrap; backdrop-filter: blur(4px); transition: background .2s, border-color .2s, box-shadow .2s; will-change: transform; }
.s3l .n { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: #e2a948; color: #0a1a21; font: 400 17px var(--f-display); flex: none; }
.s3l .t { display: flex; flex-direction: column; }
.s3l b { font: 400 18px var(--f-display); color: #f5cb7a; font-weight: 400; }
.s3l small { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: #9fb4b5; }
.s3l:hover { background: rgba(23,58,71,.92); }
.s3l.sel { border-color: #f5cb7a; box-shadow: 0 0 0 3px rgba(245,203,122,.35), 0 8px 20px rgba(0,0,0,.4); background: rgba(23,58,71,.95); }
.s3l.cur .n { animation: curPulse 1.6s ease-in-out infinite; }
@keyframes curPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(245,203,122,.7); } 50% { box-shadow: 0 0 0 8px rgba(245,203,122,0); } }
.s3l.locked { border-color: rgba(132,160,161,.35); color: #9fb4b5; }
.s3l.locked .n { background: #5b6e72; color: #d3dcdc; }
.s3l.locked b { color: #b5c4c5; }
.s3l.done .n { background: #63c28f; }
.celeb3d { position: relative; width: 100%; height: 260px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
@media (max-width: 700px) { .map3d { height: 62vh; min-height: 380px; } .s3l b { font-size: 15px; } .s3l small { display: none; } .celeb3d { height: 200px; } }
.island { cursor: pointer; }
.island:focus { outline: none; }
.island:focus-visible .shore { stroke: var(--brass-hi); stroke-width: 4; }
.island:hover .shore { stroke: var(--brass-hi); }
.island .glow { animation: glow 2.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
@keyframes glow { 0%,100% { opacity: .25; transform: scale(1); } 50% { opacity: .6; transform: scale(1.08); } }
.ship-marker { animation: bob 3s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-5px) rotate(2deg); } }
.panel {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px;
  display: flex; flex-direction: column; gap: 14px;
}
.eyebrow { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.panel h2 { font-family: var(--f-display); font-weight: 400; font-size: 38px; line-height: 1.05; margin: 0; color: var(--brass-hi); text-wrap: balance; }
.panel .sub { margin: -6px 0 0; font-size: 19px; color: var(--ink); font-weight: 500; }
.panel p { margin: 0; color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--f-mono); font-size: 13px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); background: var(--sea); }
.lesson-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.lesson-list button {
  width: 100%; display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 10px; text-align: left;
  background: var(--sea); border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px; color: var(--ink);
}
.lesson-list button:hover:not(:disabled) { border-color: var(--brass); }
.lesson-list button:disabled { opacity: .5; cursor: not-allowed; }
.lesson-list .ln { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; border: 1px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums; }
.lesson-list .done .ln { background: var(--kelp); border-color: var(--kelp); color: #08200f; }
.lesson-list .current .ln { border-color: var(--brass); color: var(--brass-hi); }
.lesson-list .meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lesson-list .solo-tag { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--brass-hi); font-weight: 700; display: block; }
.note { border: 1px dashed var(--line); border-radius: 10px; padding: 12px 14px; color: var(--ink-2); font-size: 15px; }
.welcome { margin-bottom: 18px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.welcome h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(34px, 5vw, 52px); line-height: 1; margin: 0; color: var(--ink); text-wrap: balance; }
.welcome p { margin: 4px 0 0; color: var(--ink-2); max-width: 60ch; }

/* ---------- lesson ---------- */
.lesson-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.crumb { min-width: 0; }
.crumb .eyebrow { display: block; }
.crumb h1 { font-family: var(--f-display); font-weight: 400; font-size: 32px; line-height: 1.05; margin: 0; text-wrap: balance; }
.dots { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.dot {
  width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--sea);
  display: grid; place-items: center; padding: 0; color: var(--muted);
}
.dot svg { width: 14px; height: 14px; }
.dot.done { background: var(--panel-2); color: var(--kelp); border-color: var(--kelp); }
.dot.here { border-color: var(--brass); color: var(--brass-hi); box-shadow: 0 0 0 3px rgba(226,169,72,.2); }
.dot:disabled { opacity: .4; cursor: not-allowed; }
.desk { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 20px; align-items: start; }
.desk.single { grid-template-columns: minmax(0, 760px); justify-content: center; }
.orders { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.orders .kind { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.tag { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 1px solid currentColor; }
.tag.learn { color: var(--ink-2); }
.tag.predict { color: #8fc7e0; }
.tag.task { color: var(--brass-hi); }
.tag.debug { color: var(--coral); }
.tag.project { color: var(--kelp); }
.reward { font-variant-numeric: tabular-nums; color: var(--brass-hi); font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 5px; }
.reward svg { width: 16px; height: 16px; }
.prose { min-width: 0; }
.prose p { margin: 0 0 12px; }
.prose p:last-child { margin-bottom: 0; }
.prose ul, .prose ol { margin: 0 0 12px; padding-left: 22px; }
.prose li { margin-bottom: 4px; }
.prose code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; color: var(--brass-hi); white-space: pre-wrap; }
.prose pre.block { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 0 0 12px; overflow-x: auto; }
.prose pre.block code { background: none; border: 0; padding: 0; color: var(--ink); white-space: pre; }
.prose strong { color: var(--ink); }
.speaker { display: flex; align-items: center; gap: 14px; }
.speaker svg { width: 64px; height: 64px; flex: none; }
.speaker b { font-family: var(--f-display); font-weight: 400; font-size: 28px; color: var(--brass-hi); line-height: 1; display: block; }
.speaker small { color: var(--muted); font-size: 14px; }
.story-card { padding: 30px 32px; }
.story-card .prose { font-size: 19px; }

.options { display: flex; flex-direction: column; gap: 8px; }
.opt {
  text-align: left; background: var(--sea); border: 1px solid var(--line); border-radius: 9px; padding: 10px 14px;
  display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;
}
.opt:hover:not(:disabled) { border-color: var(--brass); }
.opt .letter { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--line); display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--muted); }
.opt pre { margin: 0; font-family: var(--f-mono); font-size: 14px; white-space: pre-wrap; }
.opt.right { border-color: var(--kelp); background: rgba(99,194,143,.1); }
.opt.wrong { border-color: var(--coral); background: rgba(239,107,84,.1); }
.opt:disabled { cursor: default; }
.feedback { border-radius: 10px; padding: 12px 14px; border: 1px solid; }
.feedback.good { border-color: var(--kelp); background: rgba(99,194,143,.08); }
.feedback.bad { border-color: var(--coral); background: rgba(239,107,84,.08); }
.feedback.info { border-color: var(--line); background: var(--sea); }
.feedback h3 { margin: 0 0 4px; font-size: 17px; }
.feedback.good h3 { color: var(--kelp); }
.feedback.bad h3 { color: var(--coral); }
.hints { display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed var(--line); padding-top: 14px; }
.hint { background: var(--sea); border-left: 3px solid var(--brass); border-radius: 0 8px 8px 0; padding: 9px 12px; font-size: 16px; }
.hint .prose code { font-size: .82em; }
.hint-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--sea); border: 1px solid var(--coral); border-radius: 9px; padding: 10px 12px; font-size: 15px; }
.solution pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 6px 0; overflow-x: auto; font-size: 14px; }

/* ---------- interpreter (editor + console) ---------- */
.interp { background: var(--code-bg); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.interp-bar { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.interp-bar .title { font-family: var(--f-mono); font-size: 13px; color: var(--muted); margin-right: auto; }
.editor-host { min-height: 220px; position: relative; }
.editor-host textarea.fallback { width: 100%; min-height: 240px; background: var(--code-bg); border: 0; padding: 12px; font-family: var(--f-mono); font-size: 14px; resize: vertical; }
.stdin { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; background: var(--sea); }
.stdin label { font-size: 13px; color: var(--muted); }
.stdin textarea { background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font-family: var(--f-mono); font-size: 14px; min-height: 58px; resize: vertical; }
.console { border-top: 1px solid var(--line); padding: 12px 14px; min-height: 120px; max-height: 420px; overflow: auto; font-size: 15px; }
.console .label { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
.console pre.out { margin: 0; font-family: var(--f-mono); font-size: 14px; white-space: pre-wrap; word-break: break-word; color: var(--ink); }
.console .empty { color: var(--muted); font-style: italic; }
.errbox { margin-top: 10px; border: 1px solid var(--coral); border-radius: 9px; overflow: hidden; }
.errbox .raw { background: rgba(239,107,84,.12); padding: 8px 12px; font-family: var(--f-mono); font-size: 13px; color: #ffb3a5; white-space: pre-wrap; word-break: break-word; }
.errbox .plain { padding: 10px 12px; display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }
.errbox .plain svg { width: 34px; height: 34px; }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.spinner { width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--brass); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.testlist { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
.testlist li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; }
.cm-errline { background: rgba(239,107,84,.16); }

.lesson-foot { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; flex-wrap: wrap; }

/* ---------- completion ---------- */
.complete { max-width: 640px; margin: 20px auto; text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 34px 28px; }
.complete h2 { font-family: var(--f-display); font-weight: 400; font-size: 48px; margin: 0; color: var(--brass-hi); line-height: 1; text-wrap: balance; }
.complete .big { font-size: 22px; font-variant-numeric: tabular-nums; }
.complete .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

/* ---------- log & workshop ---------- */
.page-title { font-family: var(--f-display); font-weight: 400; font-size: clamp(34px, 5vw, 50px); margin: 0 0 4px; line-height: 1; }
.page-sub { color: var(--ink-2); margin: 0 0 20px; max-width: 70ch; }
.log-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); align-items: start; }
.log-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.log-card h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 28px; color: var(--brass-hi); line-height: 1.1; }
.log-card.locked { opacity: .6; }
.workshop { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }

/* ---------- modal & toast ---------- */
.modal-back { position: fixed; inset: 0; z-index: 50; background: rgba(4,12,16,.78); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.modal { width: min(640px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 26px; display: flex; flex-direction: column; gap: 14px; max-height: calc(100dvh - 32px); overflow-y: auto; }
.modal h2 { font-family: var(--f-display); font-weight: 400; font-size: 40px; color: var(--brass-hi); margin: 0; line-height: 1; text-wrap: balance; }
.modal p { margin: 0; color: var(--ink-2); }
.choice-grid { display: grid; gap: 10px; }
.choice { text-align: left; background: var(--sea); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.choice:hover { border-color: var(--brass); }
.choice b { font-size: 18px; }
.choice span { color: var(--muted); font-size: 15px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 6px 16px; color: var(--ink-2); font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--brass); color: #1b1408; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field textarea { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-family: var(--f-mono); font-size: 12px; min-height: 80px; resize: vertical; word-break: break-all; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.settings-sec { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.settings-sec h3 { margin: 0; font-size: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.switch { display: flex; gap: 10px; align-items: center; }
.switch input { width: 20px; height: 20px; accent-color: var(--brass); }
.pq-code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 0; font-family: var(--f-mono); font-size: 14px; overflow-x: auto; }
.progress-line { height: 4px; background: var(--sea); border-radius: 2px; overflow: hidden; }
.progress-line i { display: block; height: 100%; background: var(--brass); }
.toasts { position: fixed; z-index: 60; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(150px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast { background: var(--panel-2); border: 1px solid var(--brass); color: var(--ink); border-radius: 10px; padding: 10px 14px; display: flex; gap: 10px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.4); animation: toastin .3s ease-out; max-width: min(360px, calc(100vw - 32px)); }
.toast svg { width: 26px; height: 26px; flex: none; }
.toast b { color: var(--brass-hi); }
@keyframes toastin { from { transform: translateY(12px); opacity: 0; } }
.badges { display: flex; flex-wrap: wrap; gap: 8px; }
.badge { display: flex; gap: 8px; align-items: center; background: var(--sea); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 6px; font-size: 14px; }
.badge.off { opacity: .35; }
.badge svg { width: 22px; height: 22px; }

/* ---------- CodeMirror skin ---------- */
.CodeMirror { height: auto; min-height: 220px; background: var(--code-bg); color: var(--ink); font-family: var(--f-mono); font-size: 15px; line-height: 1.55; }
.CodeMirror-scroll { min-height: 220px; }
.CodeMirror-gutters { background: var(--code-bg); border-right: 1px solid var(--line); }
.CodeMirror-linenumber { color: #4f6f78; }
.CodeMirror-cursor { border-left: 2px solid var(--brass-hi); }
.CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected { background: rgba(226,169,72,.22) !important; }
.CodeMirror-matchingbracket { color: var(--brass-hi) !important; text-decoration: underline; }
.cm-s-default .cm-keyword { color: #e88c6a; }
.cm-s-default .cm-builtin { color: #7fc6e6; }
.cm-s-default .cm-string { color: #a9d38a; }
.cm-s-default .cm-number { color: #f0c36b; }
.cm-s-default .cm-comment { color: #6f8d93; font-style: italic; }
.cm-s-default .cm-def { color: #f5cb7a; }
.cm-s-default .cm-variable { color: var(--ink); }
.cm-s-default .cm-variable-2 { color: #d9cba8; }
.cm-s-default .cm-property { color: #c3b7ee; }
.cm-s-default .cm-operator { color: #e2a948; }
.cm-s-default .cm-meta { color: #c3b7ee; }
.readonly .CodeMirror-cursor { display: none !important; }

/* ---------- motion ---------- */
@keyframes rise { from { transform: translateY(10px); opacity: .35; } to { transform: none; opacity: 1; } }
@keyframes pop { 0% { transform: scale(.9); } 60% { transform: scale(1.04); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@keyframes pulseGood { 0% { box-shadow: 0 0 0 0 rgba(99,194,143,.55); } 100% { box-shadow: 0 0 0 14px rgba(99,194,143,0); } }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(-70px); } }
@keyframes fogdrift { 0%,100% { transform: translateX(-10px); } 50% { transform: translateX(14px); } }
@keyframes gull { 0% { transform: translate(0,0); } 50% { transform: translate(60px,-14px); } 100% { transform: translate(120px,0); } }
@keyframes flap { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.45); } }
@keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes pipbob { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-3px) rotate(-3deg); } }
@keyframes lid { 0% { transform: rotate(0); } 55% { transform: rotate(-38deg); } 75% { transform: rotate(-30deg); } 100% { transform: rotate(-34deg); } }
@keyframes shine { 0% { opacity: 0; transform: scale(.4); } 40% { opacity: 1; } 100% { opacity: .55; transform: scale(1); } }
@keyframes sparkle { 0% { opacity: 0; transform: translateY(0) scale(.4); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-26px) scale(1); } }
@keyframes bannerIn { 0% { transform: translate(-50%, -30px) scale(.8); opacity: 0; } 15% { transform: translate(-50%, 0) scale(1.05); opacity: 1; } 22% { transform: translate(-50%, 0) scale(1); } 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -16px); } }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
.desk > *, .complete, .log-card, .panel { animation: rise .38s ease-out both; }
.desk > *:nth-child(2) { animation-delay: .06s; }
.story-card .prose p { animation: rise .5s ease-out both; }
.story-card .prose p:nth-child(2) { animation-delay: .12s; } .story-card .prose p:nth-child(3) { animation-delay: .24s; } .story-card .prose p:nth-child(4) { animation-delay: .36s; }
.speaker svg, .complete > svg:first-child { animation: pipbob 3.2s ease-in-out infinite; }
.pip-eye { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
/* Pip's moving parts (all transforms in the 64x64 art space) */
.pip-art .pip-body, .pip-art .pip-head, .pip-art .pip-wing, .pip-art .pip-jaw, .pip-art .pip-crest, .pip-art .pip-tail { transform-box: view-box; }
.pip-art .pip-body { transform-origin: 34px 58px; }
.pip-art .pip-head { transform-origin: 36px 34px; transition: transform .35s cubic-bezier(.3,1.6,.5,1); }
.pip-art .pip-wing { transform-origin: 26px 34px; }
.pip-art .pip-jaw { transform-origin: 44px 36px; transform: rotate(calc(var(--jaw, 0) * 38deg)); }
.pip-art .pip-crest { transform-origin: 33px 21px; }
.pip-art .pip-tail { transform-origin: 23px 46px; }
.pip-art .pip-pupil { transition: transform .3s ease; }
@keyframes wingflap { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-48deg) scaleY(1.1); } }
@keyframes hop { 0%,100% { transform: translateY(0) scale(1); } 15% { transform: translateY(0) scale(1.08,.9); } 45% { transform: translateY(-13px) scale(.95,1.06); } 75% { transform: translateY(0) scale(1.06,.93); } }
@keyframes ruffle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-14deg); } 60% { transform: rotate(10deg); } }
@keyframes tailwag { 0%,100% { transform: rotate(0); } 30% { transform: rotate(12deg); } 70% { transform: rotate(-9deg); } }
@keyframes jawchat { 0%,100% { transform: rotate(0); } 50% { transform: rotate(34deg); } }
@keyframes dance { 0%,100% { transform: rotate(0) translateY(0); } 25% { transform: rotate(-9deg) translateY(-4px); } 75% { transform: rotate(9deg) translateY(-4px); } }
.pip-art.flap .pip-wing { animation: wingflap .16s ease-in-out 6; }
.pip-art.hop .pip-body { animation: hop .55s ease-out 2; }
.pip-art.dance .pip-body { animation: dance .5s ease-in-out 4; }
.pip-art.ruffle .pip-crest { animation: ruffle .6s ease-in-out 2; }
.pip-art.wag .pip-tail { animation: tailwag .45s ease-in-out 3; }
.pip-art.tilt .pip-head { transform: rotate(-11deg); }
.pip-art.sad .pip-head { transform: rotate(8deg) translateY(1.5px); }
.pip-art.sad .pip-crest { transform: rotate(18deg); }
.pip-art.chat .pip-jaw { animation: jawchat .18s ease-in-out infinite; }
/* the companion in the corner */
#pip-mate { position: fixed; right: 16px; bottom: 10px; z-index: 40; display: flex; align-items: flex-end; gap: 4px; pointer-events: none; }
#pip-mate[hidden] { display: none; }
#pip-mate .pm-btn { transition: transform .35s cubic-bezier(.3,1.4,.5,1); }
#pip-mate.ducked .pm-btn { transform: translateY(88px); pointer-events: none; }
#pip-mate.ducked .pm-bubble { margin-bottom: 20px; }
#pip-mate .pm-btn { pointer-events: auto; width: 124px; height: 132px; padding: 0; border: 0; background: none; cursor: pointer; position: relative; }
#pip-mate .pm-body { position: absolute; inset: 0 0 8px; display: block; animation: pipbob 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
#pip-mate .pm-btn svg.pip-art { width: 124px; height: 124px; overflow: visible; filter: drop-shadow(0 6px 8px rgba(0,0,0,.45)); }
#pip-mate .pm-perch { position: absolute; left: 2px; right: 0; bottom: 8px; height: 9px; border-radius: 5px; background: linear-gradient(#8a5a2b, #5a3a1a); box-shadow: 0 3px 0 #2b1b0c; }
#pip-mate .pm-perch::before, #pip-mate .pm-perch::after { content: ""; position: absolute; top: 9px; width: 6px; height: 14px; background: #5a3a1a; border-radius: 0 0 3px 3px; }
#pip-mate .pm-perch::before { left: 18px; } #pip-mate .pm-perch::after { right: 18px; }
#pip-mate .pm-btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 12px; }
#pip-mate .pm-emote { position: absolute; left: 58%; top: -6px; font: 400 34px/1 "Pirata One", serif; color: #f5cb7a; text-shadow: 0 2px 0 #6b4a12, 0 0 12px rgba(245,203,122,.6); opacity: 0; pointer-events: none; }
#pip-mate .pm-emote.pop { animation: emotePop 1.3s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes emotePop { 0% { opacity: 0; transform: translateY(14px) scale(.3) rotate(-20deg); } 25% { opacity: 1; transform: translateY(-6px) scale(1.25) rotate(8deg); } 45% { transform: translateY(-4px) scale(1) rotate(0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-24px) scale(.9); } }
#pip-mate .pm-bubble { position: relative; max-width: min(320px, 64vw); margin-bottom: 78px; padding: 12px 16px; border-radius: 18px 18px 4px 18px; background: #fff8e7; color: #1c1710; border: 3px solid #1c1710;
  font: 700 17px/1.32 "Alegreya Sans", sans-serif; box-shadow: 4px 5px 0 rgba(0,0,0,.35); opacity: 0; transform: translateY(10px) scale(.85) rotate(-3deg); transform-origin: 100% 100%;
  transition: opacity .18s ease, transform .3s cubic-bezier(.3,1.7,.5,1); min-height: 1.3em; }
#pip-mate .pm-bubble.show { opacity: 1; transform: none; }
#pip-mate .pm-bubble::after { content: ""; position: absolute; right: -14px; bottom: 8px; width: 16px; height: 16px; background: #fff8e7; border-right: 3px solid #1c1710; border-bottom: 3px solid #1c1710; transform: skewY(-35deg) rotate(-20deg); }
@media (max-width: 700px) { #pip-mate .pm-btn { width: 80px; height: 86px; } #pip-mate .pm-btn svg.pip-art { width: 80px; height: 80px; } #pip-mate .pm-bubble { margin-bottom: 48px; font-size: 15px; } #pip-mate .pm-emote { font-size: 26px; } }
/* Pip's faces */
.pip-art .pip-happy, .pip-art .pip-lid, .pip-art .pip-brow, .pip-art .pip-blush { display: none; }
.pip-art.e-happy .pip-open, .pip-art.e-love .pip-open { display: none; }
.pip-art.e-happy .pip-happy, .pip-art.e-love .pip-happy, .pip-art.e-love .pip-blush, .pip-art.e-happy .pip-blush { display: inline; }
.pip-art.e-annoyed .pip-lid, .pip-art.e-annoyed .pip-brow, .pip-art.e-sleepy .pip-lid { display: inline; }
.pip-art.e-surprised .pip-open { transform: scale(1.18); transform-origin: 38px 27px; transform-box: view-box; }
.pip-art.e-surprised .pip-pupil { r: 1.7; }
.pip-art.e-sleepy .pip-lid { transform: scaleY(1.6); transform-origin: 38px 27px; transform-box: view-box; }
.pip-art.flying .pip-wing { animation: wingflap .14s ease-in-out infinite; }
.pip-art.flying .pip-tail { animation: tailwag .3s ease-in-out infinite; }
body { padding-bottom: 140px; }
html.calm .pip-art *, html.calm #pip-mate .pm-body { animation: none !important; }
/* confetti */

    if (e.key === "Tab") { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText("    ", s, ta.selectionEnd, "end"); }

function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t2 = Math.imul(seed ^ (seed >>> 15), 1 | seed); t2 = (t2 + Math.imul(t2 ^ (t2 >>> 7), 61 | t2)) ^ t2; return ((t2 ^ (t2 >>> 14)) >>> 0) / 4294967296; }; }

  const R = rng(seed); const pts = [];
  for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2; const rr = r * (1 - wob / 2 + R() * wob); pts.push([cx + Math.cos(a) * rr * 1.18, cy + Math.sin(a) * rr * 0.86]); }

    if (i === 0) d += `M${p1[0].toFixed(1)},${p1[1].toFixed(1)}`;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }

}

    h += `<ul class="testlist">${s.tests.map((_, i) => {
      const st = i < fi ? "ok" : i === fi ? "bad" : "wait";
      return `<li><span style="color:${st === "ok" ? "var(--kelp)" : st === "bad" ? "var(--coral)" : "var(--muted)"}">${st === "ok" ? "✓" : st === "bad" ? "✗" : "·"}</span><span style="color:var(--ink-2)">${esc(S.lang === "sl" ? "Preverjanje" : "Check")} ${i + 1}</span></li>`;
    }).join("")}</ul></div>`;
    resEl.innerHTML = h;
    Sound.play(r.detail === "error" ? "error" : "fail");
    shakeEl($(".feedback", resEl));
    LS.fails = (LS.fails || 0) + 1;
    const cat = r.detail === "error" ? errCat(r.err || res.err) : "wrong";
    if (LS.fails === 1 || LS.fails % 3 === 0 || cat !== "wrong") Pip.say(cat, { voice: LS.fails === 1 ? "always" : "throttle", gap: 15000 });
    else Pip.react(LS.fails % 2 ? "tilt" : "sad");
  }
}
function onNext() {
  const { ch, l, idx } = LS;
  const s = l.steps[idx], k = keyOf(ch, l, s);
  if (s.type === "story") complete(k, 0);
  if (s.type === "learn") complete(k, BASE.learn, $(".orders .reward"));
  if (!S.done[k]) return;
  if (idx < l.steps.length - 1) { Sound.play("page"); LS.idx++; LS.fails = 0; renderStep(); return; }
  lessonComplete();
}
function lessonComplete() {
  if (LS.interp) { LS.interp.dispose(); LS.interp = null; }
  const { ch, l } = LS;
  const coins = l.steps.reduce((a, s) => a + ((S.done[keyOf(ch, l, s)] || {}).r || 0), 0);
  const noHints = l.steps.every((s) => !S.hints[keyOf(ch, l, s)] && !S.peek[keyOf(ch, l, s)]);
  if (noHints && l.steps.some((s) => s.type === "code")) award("no_hints");
  const island = chapterDone(ch);
  if (island) award("island");
  if (island && ch.id === CH[CH.length - 1].id) award("crown");
  const li = ch.lessons.indexOf(l);
  const nextL = ch.lessons[li + 1];
  const tg = nextTarget();
  Sound.play("fanfare");
  const finale = island && ch.id === CH[CH.length - 1].id;
  confetti(island ? 110 : 45);
  setTimeout(() => { Pip.say(finale ? "finale" : island ? "island" : "ok", { voice: island ? "always" : "throttle" }); if (island) Pip.fly(); }, 1200);
  const want3d = window.Sea3D && Sea3D.ok && !S.no3d;
  $("#view").innerHTML = `<div class="complete">${want3d ? '<div class="celeb3d" id="celeb3d"></div>' : `${island ? CAPTAIN : PIP}${CHEST.replace('class="chest"', 'class="chest" style="width:120px;height:100px"')}`}
    <div class="eyebrow">${esc(L(ch.island))}</div>
    <h2>${esc(island ? t("islandDone") : t("lessonDone"))}</h2>
    <p class="big">${ICON.coin.replace("<svg", '<svg width="26" height="26" style="vertical-align:-6px"')} <b>${coins}</b> ${esc(t("doubloons"))} ${esc(t("earned"))}</p>
    ${island && ch.log ? `<p style="margin:0;color:var(--ink-2);max-width:48ch">${esc(S.lang === "sl" ? "Plonk listek za ta otok je zdaj v Kapitanovem dnevniku." : "This island's cheat sheet is waiting in the Captain's Log.")}</p>` : ""}
    <div class="row">
      ${nextL ? `<button class="btn primary" type="button" data-lesson="${nextL.id}">${esc(t("nextLesson"))}: ${esc(L(nextL.title))} →</button>` : tg ? `<button class="btn primary" type="button" data-lesson="${tg.l.id}">${esc(t("continue"))}: ${esc(L(tg.l.title))} →</button>` : ""}
      <button class="btn" type="button" data-go="map">${esc(t("backToMap"))}</button>
    </div></div>`;
  selected = ch.id;
  bindLessonButtons();
  window.scrollTo({ top: 0 });
  if (want3d) {
    let shots = 0, booms = 0;
    disposeCeleb();
    try {
      celeb3d = Sea3D.mountCelebration($("#celeb3d"), {
        kind: finale ? "finale" : island ? "island" : "lesson", seed: chIndex(ch),
        onCannon: () => { if (shots++ < 6) Sound.play("cannon"); },
        onSplash: () => { if (shots < 8) Sound.play("splash"); },
        onBoom: () => { if (booms++ < 12) Sound.play("sparkle"); },
      });
    } catch (e) { console.warn(e); }
  }
}

/* ================= workshop & log ================= */
const WS_DEFAULT = `# The Workshop: write anything and press Run.\n# Here's a taste of where the voyage goes.\n\ncrew = ["Pip", "Marlow", "Anne"]\nfor sailor in crew:\n    print("Ahoy,", sailor)\n\nname = input("Your name, sailor? ")\nprint(f"Welcome aboard the Serpent, {name}!")\n`;
function renderWorkshop() {
  $("#view").innerHTML = `<h1 class="page-title">${esc(t("wsTitle"))}</h1><p class="page-sub">${esc(t("wsSub"))}</p><div class="workshop"><section data-interp></section></div>`;
  LS = { interp: interpreter($("[data-interp]"), { code: S.workshop ?? WS_DEFAULT, resetTo: WS_DEFAULT, title: "workshop.py", stdin: "Ben", onChange: (v) => { S.workshop = v; saveSoon(); } }) };
}
function renderLog() {
  const cards = CH.filter((c) => c.log || c.charting).map((ch) => {
    const ok = chapterUnlocked(ch) && ch.log;
    return `<article class="log-card ${ok ? "" : "locked"}"><div class="eyebrow">${esc(S.lang === "sl" ? "Otok" : "Island")} ${chIndex(ch) + 1}</div><h2>${esc(L(ch.island))}: ${esc(L(ch.title))}</h2>
      ${ok ? `<div class="prose">${md(L(ch.log))}</div>` : `<div class="chips">${(ch.topics[S.lang] || ch.topics.en).map((x) => `<span class="chip">${esc(x)}</span>`).join("")}</div><p style="margin:0;color:var(--muted)">${esc(ch.charting ? t("chartingNote") : t("logLocked"))}</p>`}</article>`;
  }).join("");
  $("#view").innerHTML = `<h1 class="page-title">${esc(t("logTitle"))}</h1><p class="page-sub">${esc(t("logSub"))}</p><div class="log-grid">${cards}</div>`;
}

/* ================= onboarding & placement ================= */
function langSeg() {
  return `<div class="row"><span class="eyebrow">${esc(t("language"))}</span><div class="seg" role="group">
    <button type="button" data-setlang="en" aria-pressed="${S.lang === "en"}">English</button>
    <button type="button" data-setlang="sl" aria-pressed="${S.lang === "sl"}">Slovenščina</button></div></div>`;
}
function bindLang(m, again) {
  $$("[data-setlang]", m).forEach((b) => b.addEventListener("click", () => { S.lang = b.dataset.setlang; save(); route(true); again(); }));
}
function openWelcome() {
  openModal(`${PIP.replace("<svg", '<svg width="72" height="72"')}<h2>${esc(t("startH"))}</h2><p>${esc(t("startP"))}</p>${langSeg()}
    <div class="choice-grid">
      <button class="choice" type="button" data-start="new"><b>${esc(t("newbie"))}</b><span>${esc(t("newbieS"))}</span></button>
      <button class="choice" type="button" data-start="test"><b>${esc(t("someExp"))}</b><span>${esc(t("someExpS"))}</span></button>
      <button class="choice" type="button" data-start="free"><b>${esc(t("explore"))}</b><span>${esc(t("exploreS"))}</span></button>
    </div>`, (m) => {
    bindLang(m, openWelcome);
    $$("[data-start]", m).forEach((b) => b.addEventListener("click", () => {
      const v = b.dataset.start;
      if (v === "test") { openPlacement(); return; }
      S.onboarded = true; if (v === "free") S.unlockAll = true; save(); closeModal(); setTimeout(() => Pip.say("welcome", { voice: "always" }), 400);
      go(v === "new" ? CH[0].lessons[0].id : "map");
    }));
  }, false);
}
function openPlacement(i = 0, answers = []) {
  const Q = CUR.placement;
  if (i >= Q.length) return placementResult(answers);
  const q = Q[i];
  openModal(`<div class="eyebrow">${esc(t("placementH"))} · ${i + 1}/${Q.length}</div><div class="progress-line"><i style="width:${(i / Q.length) * 100}%"></i></div>
    <p>${esc(t("placementP"))}</p><pre class="pq-code">${esc(q.code)}</pre>
    <div class="options">${q.options.map((o, k) => `<button class="opt" type="button" data-a="${k}"><span class="letter">${"ABCD"[k]}</span><pre>${esc(L(o))}</pre></button>`).join("")}</div>
    <div class="row"><button class="btn ghost small" type="button" data-a="-1">${esc(t("notSure"))}</button></div>`, (m) => {
    $$("[data-a]", m).forEach((b) => b.addEventListener("click", () => {
      const ok = +b.dataset.a === q.answer;
      Sound.play(ok ? "tick" : "click");
      // Stop at the first miss: that island is where this learner should start.
      if (!ok) placementResult(answers.concat(false));
      else openPlacement(i + 1, answers.concat(true));
    }));
  }, false);
}
function placementResult(answers) {
  const Q = CUR.placement;
  const placed = [];
  for (const ch of CH) {
    const qs = Q.map((q, i) => [q, i]).filter(([q]) => q.ch === ch.id);
    if (!qs.length || !qs.every(([, i]) => answers[i])) break;
    placed.push(ch.id);
  }
  S.placed = placed; S.onboarded = true; save();
  setTimeout(() => Pip.say("welcome", { voice: "always" }), 600);
  openModal(`${CAPTAIN.replace("<svg", '<svg width="72" height="72"')}<h2>${esc(t("placementDone"))}</h2><p>${esc(placed.length ? t("placedSome", placed.length) : t("placedNone"))}</p>
    <div class="row"><button class="btn primary" type="button" data-done>${esc(t("toChart"))}</button></div>`, (m) => {
    $("[data-done]", m).addEventListener("click", () => { closeModal(); selected = null; go("map"); });
  }, false);
}

/* ================= sound ================= */
function applyPrefs() {
  Sound.setPrefs(S.audio);
  document.documentElement.classList.toggle("calm", !!S.reduceMotion);
}
function openSound() {
  const A = S.audio;
  openModal(`<h2>${esc(t("sound"))}</h2>
    <div class="sound-row">
      <input type="checkbox" id="snd-music" ${A.music ? "checked" : ""}><label for="snd-music"><b>${esc(t("music"))}</b><br><span style="color:var(--muted);font-size:15px">${esc(t("musicS"))}</span></label>
      <span></span><input type="range" id="snd-mvol" min="0" max="1" step="0.05" value="${A.musicVol}" aria-label="${esc(t("music"))} ${esc(t("volume"))}">
      <input type="checkbox" id="snd-amb" ${A.ambience ? "checked" : ""}><label for="snd-amb"><b>${esc(t("ambience"))}</b></label>
      <input type="checkbox" id="snd-sfx" ${A.sfx ? "checked" : ""}><label for="snd-sfx"><b>${esc(t("sfx"))}</b></label>
      <span></span><input type="range" id="snd-svol" min="0" max="1" step="0.05" value="${A.sfxVol}" aria-label="${esc(t("sfx"))} ${esc(t("volume"))}">
      <input type="checkbox" id="snd-voice" ${A.voice ? "checked" : ""}><label for="snd-voice"><b>${esc(t("voice"))}</b><br><span style="color:var(--muted);font-size:15px">${esc(t("voiceS"))}</span></label>
    </div>
    <label class="switch"><input type="checkbox" id="snd-3d" ${!S.no3d ? "checked" : ""}><span><b>${esc(t("sea3d"))}</b><br><span style="color:var(--muted);font-size:15px">${esc(t("sea3dS"))}</span></span></label>
    <label class="switch"><input type="checkbox" id="snd-pip" ${S.pip ? "checked" : ""}><span><b>${esc(t("showPip"))}</b><br><span style="color:var(--muted);font-size:15px">${esc(t("showPipS"))}</span></span></label>
    <label class="switch"><input type="checkbox" id="snd-motion" ${S.reduceMotion ? "checked" : ""}><span><b>${esc(t("motion"))}</b><br><span style="color:var(--muted);font-size:15px">${esc(t("motionS"))}</span></span></label>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" type="button" data-close>${esc(t("close"))}</button></div>`, (m) => {
    const upd = () => {
      S.audio = { music: $("#snd-music", m).checked, ambience: $("#snd-amb", m).checked, sfx: $("#snd-sfx", m).checked, voice: $("#snd-voice", m).checked, musicVol: +$("#snd-mvol", m).value, sfxVol: +$("#snd-svol", m).value };
      S.pip = $("#snd-pip", m).checked; Pip.show();
      const no3d = !$("#snd-3d", m).checked; if (no3d !== !!S.no3d) { S.no3d = no3d; save(); if ((location.hash || "#map").slice(1) === "map") renderMap(); }
      S.reduceMotion = $("#snd-motion", m).checked;
      save(); applyPrefs(); renderTop();
    };
    $$("input", m).forEach((i) => i.addEventListener("input", upd));
    $("#snd-svol", m).addEventListener("change", () => Sound.play("coin"));
    $("#snd-voice", m).addEventListener("change", (e) => { if (e.target.checked) Pip.say("ok1", { voice: "always" }); });
    $("[data-close]", m).addEventListener("click", closeModal);
  });
}

/* ================= settings ================= */
function openSettings() {
  const code = (() => { try { return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); } catch (e) { return ""; } })();
  openModal(`<h2>${esc(t("settings"))}</h2>${langSeg()}
    <label class="switch"><input type="checkbox" id="unlock-all" ${S.unlockAll ? "checked" : ""}><span><b>${esc(t("unlockAll"))}</b><br><span style="color:var(--muted);font-size:15px">${esc(t("unlockAllS"))}</span></span></label>
    <div class="settings-sec"><h3>${esc(t("badgesH"))}</h3><div class="badges">${Object.keys(BADGES).map((id) => { const b = BADGES[id][S.lang] || BADGES[id].en; return `<span class="badge ${S.badges.includes(id) ? "" : "off"}" title="${esc(b[1])}">${ICON.medal}${esc(b[0])}</span>`; }).join("")}</div></div>
    <div class="settings-sec"><h3>${esc(t("saveH"))}</h3><p>${esc(t("saveS"))}</p>
      <div class="field"><textarea id="save-out" readonly>${esc(code)}</textarea></div>
      <div class="row"><button class="btn small" type="button" data-copy>${esc(t("copy"))}</button></div>
      <div class="field"><label for="save-in">${esc(t("loadSave"))}</label><textarea id="save-in" spellcheck="false"></textarea></div>
      <div class="row"><button class="btn small" type="button" data-import>${esc(t("load"))}</button><span data-imsg style="font-size:15px"></span></div></div>
    <div class="settings-sec"><h3>${esc(t("resetH"))}</h3><div class="row" data-resetrow><button class="btn small" type="button" data-reset-all style="border-color:var(--coral);color:var(--coral)">${esc(t("resetBtn"))}</button></div></div>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" type="button" data-close>${esc(t("close"))}</button></div>`, (m) => {
    bindLang(m, openSettings);
    $("#unlock-all", m).addEventListener("change", (e) => { S.unlockAll = e.target.checked; save(); route(true); });
    $("[data-close]", m).addEventListener("click", closeModal);
    $("[data-copy]", m).addEventListener("click", (e) => {
      const ta = $("#save-out", m);
      const done = () => { e.target.textContent = t("copied"); };
      try { navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); }); } catch (x) { ta.select(); }
    });
    $("[data-import]", m).addEventListener("click", () => {
      const msg = $("[data-imsg]", m);
      try {
        const obj = JSON.parse(decodeURIComponent(escape(atob($("#save-in", m).value.trim()))));
        if (!obj || typeof obj !== "object" || !("done" in obj)) throw 0;
        S = Object.assign(JSON.parse(JSON.stringify(DEF)), obj); save();
        msg.style.color = "var(--kelp)"; msg.textContent = t("loaded"); route(true);
      } catch (x) { msg.style.color = "var(--coral)"; msg.textContent = t("badSave"); }
    });
    $("[data-reset-all]", m).addEventListener("click", () => {
      const row = $("[data-resetrow]", m);
      row.innerHTML = `<div class="confirm"><span>${esc(t("resetConfirm"))}</span><button class="btn small" type="button" data-erase style="border-color:var(--coral);color:var(--coral)">${esc(t("erase"))}</button><button class="btn small primary" type="button" data-keep>${esc(t("cancel"))}</button></div>`;
      $("[data-erase]", m).addEventListener("click", () => { const lang = S.lang; S = JSON.parse(JSON.stringify(DEF)); S.lang = lang; save(); selected = null; closeModal(); go("map"); openWelcome(); });
      $("[data-keep]", m).addEventListener("click", openSettings);
    });
  });
}

/* ================= router ================= */
function go(h) { if ((location.hash || "#map").slice(1) === h) route(); else location.hash = h; }
function route(keepStep) {
  if (LS && LS.interp) { LS.interp.dispose(); }
  disposeChart(); disposeCeleb();
  const h = (location.hash || "#map").slice(1);
  renderTop();
  Sound.setScene(h === "workshop" || findLesson(h) ? "lesson" : "map");
  if (h === "workshop") { LS = null; renderWorkshop(); }
  else if (h === "log") { LS = null; renderLog(); }
  else if (findLesson(h)) {
    if (keepStep === true && LS && LS.l && LS.l.id === h) renderStep();
    else openLesson(h);
  } else { LS = null; renderMap(); }
}
window.addEventListener("hashchange", () => route());

applyPrefs();
route();
Pip.mount();
if (!S.onboarded) openWelcome();
})();
</script>

</body>
</html>
